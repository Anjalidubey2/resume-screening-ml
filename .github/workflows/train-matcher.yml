name: Retrain matcher (English)

# Run from the Actions tab -> "Retrain matcher (English)" -> "Run workflow".
# The new model is saved to the repository only if every test passes with it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install libraries
        # httpx 0.28 removed the "app" argument that this FastAPI/Starlette version's TestClient uses.
        run: pip install -r requirements.txt pytest==9.2.0 httpx==0.27.2
      - name: Download the English resume-job dataset
        run: python -m services.download_datasets
      - name: Clean the data
        run: python -m services.data_preparation
      - name: Train
        run: python -m services.train_all
      - name: Check the new model and run every test
        run: |
          python check_models.py
          python -m pytest -rs
      - name: Show the new metrics
        working-directory: .
        run: |
          echo "## Matching model metrics" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/matching_model_metrics.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Save the new model to the repository
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/matching_model.pkl models/matching_tfidf_vectorizer.pkl models/active_matching_model.json \
                  outputs/matching_model_metrics.csv outputs/matching_model_report.csv
          git commit -m "Retrain matching model on English resume-job pairs"
          git push
